[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bird-tracker"
version = "0.1.0"
description = "Real-time bird detection, tracking, and DSLR capture on Raspberry Pi 5."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PyYAML>=5.4",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
pi_camera = ["picamera2>=0.3.0"]
detection = ["torch>=2.0.0", "torchvision>=0.15.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
